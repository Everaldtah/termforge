# XcodeGen spec: `xcodegen generate` writes TermForge.xcodeproj (see scripts/bootstrap.sh).
name: TermForge
options:
  bundleIdPrefix: com.everaldtah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  Debug-Sideload: debug
  Release-Sideload: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BXQW8UBNM2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Debug-Sideload:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG SIDELOAD
    Release-Sideload:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: SIDELOAD

packages:
  NodeCore:
    path: Packages/NodeCore
  TerminalUI:
    path: Packages/TerminalUI
  LinuxCore:
    path: Packages/LinuxCore

targets:
  TermForge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: nodejs-project
        type: folder
        buildPhase: resources
    dependencies:
      - package: NodeCore
      - package: TerminalUI
      - package: LinuxCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TermForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.everaldtah.termforge
            CFBundleURLSchemes: [termforge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.termforge
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TermForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TermForgeTests
    dependencies:
      - target: TermForge
      - package: NodeCore
      - package: LinuxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.termforge.tests
        GENERATE_INFOPLIST_FILE: YES

  TermForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TermForgeUITests
    dependencies:
      - target: TermForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.termforge.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TermForge:
    build:
      targets:
        TermForge: all
        TermForgeTests: [test]
        TermForgeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TermForgeTests
        - TermForgeUITests
    archive:
      config: Release
  TermForge-Sideload:
    build:
      targets:
        TermForge: all
    run:
      config: Debug-Sideload
    archive:
      config: Release-Sideload
